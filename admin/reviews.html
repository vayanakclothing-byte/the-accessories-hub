<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews & Feedback — Admin | The Accessories Hub</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="https://unpkg.com/lucide@1.61.0"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="admin-hamburger"><i data-lucide="menu"></i></button>
        <div>
          <h1>Customer Reviews & Feedback</h1>
          <div class="topbar-breadcrumb">Growth & Feedback / Product Testimonials & Moderation</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-user-info" style="display: flex; align-items: center; gap: 12px;">
          <div id="adminName" style="font-size: 0.85rem; font-weight: 500; color: var(--gold);">Admin</div>
          <div class="admin-avatar" id="adminAvatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--grey-dark); border: 1px solid var(--gold);">A</div>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <!-- Review KPIs -->
      <div class="stats-grid" style="grid-template-columns: repeat(4, 1fr);">
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon gold"><i data-lucide="star" style="width:20px;height:20px;"></i></div></div>
          <div class="stat-card-value" id="statAverageRating">0.0 / 5</div>
          <div class="stat-card-label">Average Customer Rating</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon green"><i data-lucide="check-circle" style="width:20px;height:20px;"></i></div></div>
          <div class="stat-card-value" id="statApprovedReviews">0</div>
          <div class="stat-card-label">Approved & Public</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon orange"><i data-lucide="clock" style="width:20px;height:20px;"></i></div></div>
          <div class="stat-card-value" id="statPendingReviews">0</div>
          <div class="stat-card-label">Awaiting Moderation</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon blue"><i data-lucide="message-square" style="width:20px;height:20px;"></i></div></div>
          <div class="stat-card-value" id="statTotalReviews">0</div>
          <div class="stat-card-label">Total Testimonials</div>
        </div>
      </div>

      <!-- Reviews Table Card -->
      <div class="table-card">
        <div class="table-header">
          <div class="table-title">
            <i data-lucide="star" style="width:18px;height:18px;margin-right:8px;vertical-align:middle;"></i>
            Customer Testimonials
          </div>
          <div class="table-actions">
            <select class="form-select" id="reviewFilter" onchange="filterReviews()" style="padding:6px 12px;font-size:0.85rem;width:150px;">
              <option value="">All Reviews</option>
              <option value="approved">Approved</option>
              <option value="pending">Pending Moderation</option>
            </select>
            <div class="table-search">
              <i data-lucide="search" style="width:16px;height:16px;color:var(--white-muted);"></i>
              <input type="text" placeholder="Search customer, comment..." id="reviewSearch" oninput="filterReviews()">
            </div>
            <button class="btn btn-outline btn-sm" onclick="exportReviewsCSV()"><i data-lucide="download" style="width:14px;height:14px;"></i> Export</button>
            <button class="btn btn-gold btn-sm" onclick="openAddReviewModal()">+ Add Testimonial</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Customer</th>
                <th>Product</th>
                <th>Rating</th>
                <th>Review Comment</th>
                <th>Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="reviewsTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" onclick="closeAllModals()"></div>

<!-- Add Testimonial Modal -->
<div class="modal" id="reviewModal" style="width:480px;">
  <div class="modal-header">
    <h3>Add Customer Testimonial</h3>
    <span class="modal-close" onclick="closeAllModals()">✕</span>
  </div>
  <div class="modal-body">
    <form id="reviewForm" onsubmit="saveReview(event)">
      <div class="form-group">
        <label class="form-label">Customer Name *</label>
        <input class="form-input" id="revCustomer" required placeholder="e.g. Alisha Shrestha">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Associated Product</label>
          <select class="form-select" id="revProductSelect">
            <option value="">General Store Review</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Star Rating (1-5) *</label>
          <select class="form-select" id="revRating" required>
            <option value="5" selected>★★★★★ (5 Stars - Exceptional)</option>
            <option value="4">★★★★☆ (4 Stars - Very Good)</option>
            <option value="3">★★★☆☆ (3 Stars - Average)</option>
            <option value="2">★★☆☆☆ (2 Stars - Below Average)</option>
            <option value="1">★☆☆☆☆ (1 Star - Poor)</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Comment / Feedback *</label>
        <textarea class="form-textarea" id="revComment" rows="3" required placeholder="Customer review text..."></textarea>
      </div>
      <div class="modal-footer" style="padding:0; border:none; margin-top:20px;">
        <button type="button" class="btn btn-ghost" onclick="closeAllModals()">Cancel</button>
        <button type="submit" class="btn btn-gold">Publish Review</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/admin-guard.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/reviews-admin.js"></script>
</body>
</html>
