<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security & Audit Logs — Admin | The Accessories Hub</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="https://unpkg.com/lucide@1.61.0"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="admin-hamburger"><i data-lucide="menu"></i></button>
        <div>
          <h1>Security & Audit Trail</h1>
          <div class="topbar-breadcrumb">System & Administration / Immutable System Event Ledger</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-user-info" style="display: flex; align-items: center; gap: 12px;">
          <div id="adminName" style="font-size: 0.85rem; font-weight: 500; color: var(--gold);">Admin</div>
          <div class="admin-avatar" id="adminAvatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--grey-dark); border: 1px solid var(--gold);">A</div>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <!-- Quick Audit Metrics -->
      <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon gold"><i data-lucide="scroll-text" style="width:20px;height:20px;"></i></div></div>
          <div class="stat-card-value" id="statAuditCount">0</div>
          <div class="stat-card-label">Total Audited Events</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon green"><i data-lucide="shield-check" style="width:20px;height:20px;"></i></div></div>
          <div class="stat-card-value" id="statTodayEvents">0</div>
          <div class="stat-card-label">Events Logged Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon blue"><i data-lucide="lock" style="width:20px;height:20px;"></i></div></div>
          <div class="stat-card-value">Enforced</div>
          <div class="stat-card-label">Row-Level Security (RLS)</div>
        </div>
      </div>

      <!-- Audit Logs Table -->
      <div class="table-card">
        <div class="table-header">
          <div class="table-title">
            <i data-lucide="shield" style="width:18px;height:18px;margin-right:8px;vertical-align:middle;"></i>
            Administrative Audit Trail
          </div>
          <div class="table-actions">
            <div class="table-search">
              <i data-lucide="search" style="width:16px;height:16px;color:var(--white-muted);"></i>
              <input type="text" placeholder="Search actor, action, entity..." id="auditSearch" oninput="filterAuditLogs()">
            </div>
            <button class="btn btn-outline btn-sm" onclick="exportAuditCSV()"><i data-lucide="download" style="width:14px;height:14px;"></i> Export Audit CSV</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>Timestamp</th>
                <th>Actor Email</th>
                <th>Action Taken</th>
                <th>Entity Type</th>
                <th>Record ID</th>
                <th>Change Summary & Details</th>
              </tr>
            </thead>
            <tbody id="auditTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/admin-guard.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/audit-admin.js"></script>
</body>
</html>
