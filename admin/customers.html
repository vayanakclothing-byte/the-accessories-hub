<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers & CRM — Admin | The Accessories Hub</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="https://unpkg.com/lucide@1.61.0"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="admin-hamburger"><i data-lucide="menu"></i></button>
        <div><h1>Customers & CRM</h1><div class="topbar-breadcrumb">Finance & Commerce / Customer Directory & Purchase Profiles</div></div>
      </div>
      <div class="topbar-right">
        <div class="admin-user-info" style="display: flex; align-items: center; gap: 12px;">
          <div id="adminName" style="font-size: 0.85rem; font-weight: 500; color: var(--gold);">Admin</div>
          <div class="admin-avatar" id="adminAvatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--grey-dark); border: 1px solid var(--gold);">A</div>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-card">
        <div class="table-header">
          <div class="table-title"><i data-lucide="users" style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;"></i> Customer Directory</div>
          <div class="table-actions">
            <div class="table-search"><i data-lucide="search" style="width: 16px; height: 16px; margin-right: 8px; color: var(--white-muted);"></i><input type="text" placeholder="Search name, phone..." id="customerSearch" oninput="searchCustomers()"></div>
            <button class="btn btn-outline btn-sm" onclick="exportCustomersCSV()"><i data-lucide="download" style="width:14px;height:14px;"></i> Export CSV</button>
            <button class="btn btn-gold btn-sm" onclick="openAddCustomer()">+ Add Customer</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Customer</th><th>Phone</th><th>Address</th><th>Orders</th><th>Total Spent</th><th>Joined</th><th>Actions</th></tr></thead>
          <tbody id="customersBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" onclick="closeAllModals()"></div>

<!-- Customer Detail Modal -->
<div class="modal wide" id="customerDetailModal">
  <div class="modal-header"><h3>Customer Profile & Order History</h3><span class="modal-close" onclick="closeAllModals()">✕</span></div>
  <div class="modal-body" id="customerDetailContent"></div>
</div>

<!-- Add/Edit Customer Modal -->
<div class="modal" id="customerModal" style="width:480px;">
  <div class="modal-header"><h3 id="customerModalTitle">Add Customer</h3><span class="modal-close" onclick="closeAllModals()">✕</span></div>
  <div class="modal-body">
    <form id="customerForm" onsubmit="saveCustomer(event)">
      <input type="hidden" id="cId">
      <div class="form-group"><label class="form-label">Full Name *</label><input class="form-input" id="cName" required placeholder="e.g. Priya Sharma"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Email</label><input class="form-input" type="email" id="cEmail" placeholder="email@example.com"></div>
        <div class="form-group"><label class="form-label">Phone *</label><input class="form-input" id="cPhone" required placeholder="+977 98XXXXXXXX"></div>
      </div>
      <div class="form-group"><label class="form-label">Address</label><input class="form-input" id="cAddress" placeholder="City, Area, Landmark"></div>
      <div class="form-group"><label class="form-label">Internal Support Notes</label><textarea class="form-textarea" id="cNotes" placeholder="Preferences, special packaging requests..."></textarea></div>
      <div class="modal-footer" style="padding:0;border:none;margin-top:18px;">
        <button type="button" class="btn btn-ghost" onclick="closeAllModals()">Cancel</button>
        <button type="submit" class="btn btn-gold">Save Customer</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/admin-guard.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/customers-admin.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
