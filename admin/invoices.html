<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Billing & Invoices — Admin ERP | The Accessories Hub</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="https://unpkg.com/lucide@1.61.0"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-overlay" onclick="document.getElementById('sidebar').classList.remove('open')"></div>

  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="admin-hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')"><i data-lucide="menu"></i></button>
        <div>
          <h1>Billing & Invoices</h1>
          <div class="topbar-breadcrumb"><a href="index.html">ERP</a> / Finance & Commerce / Invoices</div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="admin-user-info" style="display: flex; align-items: center; gap: 12px;">
          <div id="adminName" style="font-size: 0.85rem; font-weight: 500; color: var(--gold);">Admin</div>
          <div class="admin-avatar" id="adminAvatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--grey-dark); border: 1px solid var(--gold);">A</div>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-card">
        <div class="table-header">
          <div class="table-title"><i data-lucide="receipt" style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;"></i> All Tax & Sales Invoices</div>
          <div class="table-actions">
            <button class="btn btn-outline" onclick="exportInvoicesCSV()"><i data-lucide="download" style="width: 14px; height: 14px; margin-right: 6px;"></i> Export CSV</button>
            <button class="btn btn-gold" onclick="openGenerateInvoice()">+ Generate Invoice</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Invoice #</th><th>Order</th><th>Customer</th><th>Amount</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="invoicesBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" onclick="closeAllModals()"></div>

<!-- Generate Invoice Modal -->
<div class="modal" id="generateModal" style="width:480px;">
  <div class="modal-header"><h3>Generate Invoice</h3><span class="modal-close" onclick="closeAllModals()">✕</span></div>
  <div class="modal-body">
    <div class="alert alert-info"><i data-lucide="info" style="width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;"></i> Select an order to generate a branded PDF tax invoice.</div>
    <div class="form-group">
      <label class="form-label">Select Order</label>
      <select class="form-select" id="invoiceOrderSelect"><option value="">Select an order...</option></select>
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeAllModals()">Cancel</button>
    <button class="btn btn-gold" onclick="generateInvoice()"><i data-lucide="file-text" style="width: 16px; height: 16px; margin-right: 8px; vertical-align: middle;"></i> Generate PDF</button>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/admin-guard.js"></script>
  <script src="/admin/js/admin-app.js"></script>
  <script src="/admin/js/invoices-admin.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
