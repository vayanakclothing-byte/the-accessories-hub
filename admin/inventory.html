<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory — Admin | The Accessories Hub</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="https://unpkg.com/lucide@1.61.0"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="admin-hamburger"><i data-lucide="menu"></i></button>
        <div><h1>Inventory & Stock Ledger</h1><div class="topbar-breadcrumb">Core Operations / On-Hand Stock, Ledger History & Valuation</div></div>
      </div>
      <div class="topbar-right">
        <div class="admin-user-info" style="display: flex; align-items: center; gap: 12px;">
          <div id="adminName" style="font-size: 0.85rem; font-weight: 500; color: var(--gold);">Admin</div>
          <div class="admin-avatar" id="adminAvatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--grey-dark); border: 1px solid var(--gold);">A</div>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <!-- Stock Stats (4 cols) -->
      <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon green"><i data-lucide="check-circle" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="inStockCount">0</div>
          <div class="stat-card-label">In Stock Lines</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon orange"><i data-lucide="alert-triangle" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="lowStockCount">0</div>
          <div class="stat-card-label">Low Stock (≤ Reorder)</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon red"><i data-lucide="x-circle" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="outStockCount">0</div>
          <div class="stat-card-label">Out of Stock</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon gold"><i data-lucide="coins" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="totalAssetValue">Rs. 0</div>
          <div class="stat-card-label">Total Inventory Asset Value</div>
        </div>
      </div>

      <div class="chart-grid">
        <!-- Inventory Table -->
        <div class="table-card">
          <div class="table-header">
            <div class="table-title"><i data-lucide="package" style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;"></i> Stock Levels & Ledger</div>
            <div class="table-actions">
              <button class="btn btn-sm btn-ghost inv-filter-btn active" onclick="filterInventory('')">All</button>
              <button class="btn btn-sm btn-ghost inv-filter-btn" onclick="filterInventory('low')">Low Stock</button>
              <button class="btn btn-sm btn-ghost inv-filter-btn" onclick="filterInventory('out')">Out of Stock</button>
              <button class="btn btn-sm btn-outline" onclick="exportInventoryCSV()"><i data-lucide="download" style="width:14px;height:14px;"></i> Export CSV</button>
            </div>
          </div>
          <div style="overflow-x:auto;">
          <table>
            <thead><tr><th>Product</th><th>Cost Price</th><th>Stock</th><th>Reorder Level</th><th>Status</th><th>Quick Update</th></tr></thead>
            <tbody id="inventoryBody"></tbody>
          </table>
          </div>
        </div>

        <!-- Stock History -->
        <div class="chart-card">
          <div class="chart-card-header">
            <div class="chart-card-title"><i data-lucide="history" style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;"></i> Stock Ledger History</div>
          </div>
          <div class="timeline" id="stockTimeline" style="max-height:480px;overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/admin-guard.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/inventory-admin.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
