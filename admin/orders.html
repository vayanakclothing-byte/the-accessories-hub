<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders — Admin | The Accessories Hub</title>
  <link rel="stylesheet" href="/admin/css/admin.css">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="https://unpkg.com/lucide@1.61.0"></script>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="admin-hamburger"><i data-lucide="menu"></i></button>
        <div><h1>Orders & Fulfilment</h1><div class="topbar-breadcrumb">Core Operations / Order Workflow & Customer Shipments</div></div>
      </div>
      <div class="topbar-right">
        <div class="admin-user-info" style="display: flex; align-items: center; gap: 12px;">
          <div id="adminName" style="font-size: 0.85rem; font-weight: 500; color: var(--gold);">Admin</div>
          <div class="admin-avatar" id="adminAvatar" style="overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--grey-dark); border: 1px solid var(--gold);">A</div>
        </div>
      </div>
    </div>

    <div class="admin-content">
      <!-- Order Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon gold"><i data-lucide="list" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="totalOrdersCount">0</div>
          <div class="stat-card-label">Total Orders</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon orange"><i data-lucide="clock" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="pendingCount">0</div>
          <div class="stat-card-label">Pending / Processing</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon blue"><i data-lucide="truck" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="shippedCount">0</div>
          <div class="stat-card-label">Shipped in Transit</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header"><div class="stat-card-icon green"><i data-lucide="check-circle" style="width: 20px; height: 20px;"></i></div></div>
          <div class="stat-card-value" id="deliveredCount">0</div>
          <div class="stat-card-label">Delivered & Settled</div>
        </div>
      </div>

      <!-- Orders Table -->
      <div class="table-card">
        <div class="table-header">
          <div class="table-title"><i data-lucide="shopping-bag" style="width: 18px; height: 18px; margin-right: 8px; vertical-align: middle;"></i> Customer Orders</div>
          <div class="table-actions">
            <button class="btn btn-sm btn-ghost order-filter-btn active" onclick="filterOrders('')">All</button>
            <button class="btn btn-sm btn-ghost order-filter-btn" onclick="filterOrders('pending')">Pending</button>
            <button class="btn btn-sm btn-ghost order-filter-btn" onclick="filterOrders('shipped')">Shipped</button>
            <button class="btn btn-sm btn-ghost order-filter-btn" onclick="filterOrders('delivered')">Delivered</button>
            <button class="btn btn-sm btn-outline" onclick="exportOrdersCSV()"><i data-lucide="download" style="width:14px;height:14px;"></i> Export CSV</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>ID</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th>Payment</th><th>Date</th><th>Actions</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal-overlay" onclick="closeAllModals()"></div>

<!-- Status Update Modal -->
<div class="modal" id="statusModal" style="width:400px;">
  <div class="modal-header"><h3>Update Status: <span id="statusOrderId"></span></h3><span class="modal-close" onclick="closeAllModals()">✕</span></div>
  <div class="modal-body">
    <div class="form-group">
      <label class="form-label">Order Status</label>
      <select class="form-select" id="newStatus">
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="shipped">Shipped</option>
        <option value="delivered">Delivered</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>
    <div class="form-group" id="trackingGroup" style="display:none;">
      <label class="form-label">Tracking Number</label>
      <input class="form-input" id="trackingNumber" placeholder="e.g. NP-123456">
    </div>
  </div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeAllModals()">Cancel</button>
    <button class="btn btn-gold" onclick="saveOrderStatus()">Update Status</button>
  </div>
</div>

<!-- Order Detail & Packing Slip Modal -->
<div class="modal wide" id="orderDetailModal">
  <div class="modal-header"><h3>Order Details & Packing Slip</h3><span class="modal-close" onclick="closeAllModals()">✕</span></div>
  <div class="modal-body" id="orderDetailContent"></div>
  <div class="modal-footer">
    <button class="btn btn-ghost" onclick="closeAllModals()">Close</button>
    <button class="btn btn-outline" onclick="window.print()"><i data-lucide="printer" style="width:14px;height:14px;"></i> Print Slip</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase-client.js"></script>
<script src="/js/admin-guard.js"></script>
<script src="/admin/js/admin-app.js"></script>
<script src="/admin/js/orders-admin.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
