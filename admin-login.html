<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — The Accessories Hub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: var(--black);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .login-card {
            background-color: #0A0A0A; /* Deep charcoal */
            border: 1px solid var(--gold);
            border-radius: var(--radius-lg);
            padding: var(--space-4xl) var(--space-3xl);
            width: 100%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15); /* Subtle glow */
            position: relative;
            z-index: 10;
        }

        .logo-container {
            margin-bottom: var(--space-2xl);
        }

        .logo-text {
            font-family: var(--font-serif);
            color: var(--gold);
            font-size: 2rem;
            margin: 0;
            letter-spacing: 2px;
        }

        .sub-text {
            color: var(--white);
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
            opacity: 0.8;
        }

        .btn-admin {
            width: 100%;
            margin-top: var(--space-xl);
            background: linear-gradient(135deg, var(--gold), #E8C84A);
            color: var(--black);
            padding: 16px;
            border-radius: var(--radius-sm);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .btn-admin:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(212, 175, 55, 0.4);
        }

        .footer-note {
            margin-top: var(--space-3xl);
            color: var(--white-muted);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .error-message {
            background: rgba(192, 57, 43, 0.1);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: var(--space-lg);
            font-size: 0.85rem;
            display: none;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.05) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.1);
            border-top-color: var(--black);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="login-card">
        <div id="errorMessage" class="error-message"></div>

        <div class="logo-container">
            <h1 class="logo-text">The Accessories Hub</h1>
            <div class="sub-text">Management Portal</div>
        </div>

        <button id="adminLoginBtn" class="btn-admin">
            <i data-lucide="log-in" style="width: 20px; height: 20px;"></i>
            Sign in as Admin
        </button>

        <p class="footer-note">Restricted Access: Authorized Personnel Only</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase-client.js"></script>
    <script>
        lucide.createIcons();

        const loginBtn = document.getElementById('adminLoginBtn');
        const errorMsg = document.getElementById('errorMessage');

        // Check for error in URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('error')) {
            errorMsg.textContent = urlParams.get('error');
            errorMsg.style.display = 'block';
        }

        // --- Automatic Smooth Transition ---
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const adminEmail = 'theaccessorieshub2530@gmail.com';
                if (session.user.email === adminEmail) {
                    loginBtn.innerHTML = '<span class="loading-spinner"></span> Redircting to Dashboard...';
                    window.location.href = '/admin/index.html';
                } else {
                    errorMsg.textContent = "Your account is not authorized to access the Admin Panel.";
                    errorMsg.style.display = 'block';
                }
            }
        }

        // Run session check on load
        checkSession();

        // Listener for login button
        loginBtn.addEventListener('click', async () => {
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Authenticating...';
            
            const { data, error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/admin-login.html'
                }
            });

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in" style="width: 20px; height: 20px;"></i> Sign in as Admin';
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
