<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Sign Up — The Accessories Hub</title>
  <meta name="description" content="Access your account at The Accessories Hub.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/png" href="images/favicon.png">
</head>
<body class="login-body">

  <div class="split-screen">
    <!-- Left Side: Image -->
    <div class="split-left">
      <div class="image-overlay">
        <a href="index.html" class="logo-back">
          <img src="images/logo.webp" alt="The Accessories Hub" style="height: 60px;">
        </a>
        <div class="quote">
          <h2>Redefining Elegance</h2>
          <p>Discover hand-crafted jewelry for the modern woman.</p>
        </div>
      </div>
    </div>

    <!-- Right Side: Form -->
    <div class="split-right">
      <div class="form-container">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to access your orders, wishlists, and exclusive offers.</p>

        <button class="btn-google" onclick="handleGoogleSignIn()">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="margin-right: 10px;">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          CONTINUE WITH GOOGLE
        </button>

        <div class="divider">
          <span>or sign in with email</span>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" required placeholder="hello@example.com">
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="••••••••">
          </div>
          <div class="form-options">
            <label class="custom-checkbox">
              <input type="checkbox">
              <span class="checkmark"></span>
              Remember me
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <button type="submit" class="btn btn-gold btn-block">Sign In</button>
        </form>

        <p class="toggle-text">
          New to the Hub? <a href="#" id="toggleSignUp">Create an Account</a>
        </p>

        <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--grey-mid); padding-top: 16px;">
          <a href="/admin/login.html" style="font-size: 0.78rem; color: var(--gold-dark); text-decoration: none; font-weight: 500;">
            ✦ Staff & Admin Portal &rarr;
          </a>
        </div>

        <!-- Message Container -->
        <div id="authMessage" style="margin-top: 15px; text-align: center; color: var(--red); display: none;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
